<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Futbolista Tycoon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚽ Futbolista Tycoon</h1>

    <div id="stats">
        <p>💰 Dinero: <span id="money">0</span> €</p>
        <p>📈 Tiro: <span id="shoot">1</span></p>

        <!-- Barra de progreso del tiro -->
        <div id="shootBarContainer" style="background:#ddd; width:80%; height:20px; margin:0 auto; border-radius:10px;">
            <div id="shootBar" style="background:#e74c3c; width:0%; height:100%; border-radius:10px;"></div>
        </div>
    </div>

    <button id="trainBtn">Entrenar</button>

    <!-- TIENDA DE MEJORAS -->
    <h2>Mejoras</h2>
    <div id="upgrades">
        <button id="coachBtn">Entrenador (100 €)</button>
        <button id="gymBtn">Gimnasio (500 €)</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
